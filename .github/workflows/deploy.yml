name: Deploy to Local Docker

on:
  push:
    branches:
      - main

jobs:
  # --- NEW JOB: We run tests in GitHub's cloud! ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Tests
        run: npm test

  # --- EXISTING JOB: Deploy to your laptop ---
  build-and-deploy:
    # "needs: test" means this job WILL NOT RUN if the test job fails!
    needs: test
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t my-node-backend .

      - name: Stop and Remove Old Container (if exists)
        continue-on-error: true
        run: |
          docker stop node-backend-container
          docker rm node-backend-container

      - name: Run New Docker Container
        run: |
          docker run -d -p 3000:3000 \
          -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
          --name node-backend-container my-node-backend
