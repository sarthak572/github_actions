name: Deploy to Local Docker

on:
  push:
    branches:
      - main
  # Run tests when someone opens a Pull Request
  pull_request:
    branches:
      - main
  # Adds a manual "Run Workflow" button in the GitHub UI
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Just testing the button!'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Tests
        run: npm test

  build-and-deploy:
    needs: test
    # Conditionals! Do not deploy if this is just a Pull Request
    if: github.event_name != 'pull_request'
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log manual trigger reason (if applicable)
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual deploy reason - ${{ github.event.inputs.reason }}"

      - name: Build Docker Image
        run: docker build -t my-node-backend .

      - name: Stop and Remove Old Container (if exists)
        continue-on-error: true
        run: |
          docker stop node-backend-container
          docker rm node-backend-container

      - name: Run New Docker Container
        run: |
          docker run -d -p 3000:3000 \
          -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
          --name node-backend-container my-node-backend
